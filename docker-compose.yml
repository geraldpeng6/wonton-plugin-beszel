# Beszel：CPU、内存、磁盘、网络和温度的历史图表。Hub（网页和存储）与 Agent（采集）在同一个插件里，
# 经数据目录里的 unix 套接字相连，Agent 走 SSH 服务，Hub 主动拨号（上游“Connecting to a local agent”的做法）。
services:
  hub:
    # 上游官方镜像（MIT），按 amd64/arm64 清单列表摘要固定。
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    environment:
      # 通知和页面里的链接用它，语义是插件的公开地址。
      APP_URL: ${WONTON_APP_URL}
      # 新装时（空数据库）由上游建第一个管理员：账号邮箱是主人用户名拼的固定内部地址，密码由核心生成。
      # 之后这两项不再生效；老版本里管理员的邮箱是真实邮箱，升级或重装时 key 步骤就地改成内部地址。
      USER_EMAIL: ${WONTON_OWNER_NAME:?插件要主人的用户名}@beszel.internal
      USER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
      # 网关代登录：网关注入这个头，值是主人用户名拼的固定内部地址（上游按邮箱找用户，不建新用户）。
      # 认人不看邮箱——邮箱会变，用户名不会，改了邮箱也进得去。
      TRUSTED_AUTH_HEADER: X-Wonton-User-Email
      # 只信核心的地址；别的来源自己带这个头也进不来。
      TRUSTED_PROXY_IPS: ${WONTON_CORE_ADDRESS}
      # 网页只经网关进来，网关已经认过人；留着应用自己的登录页只会多一道没人知道密码的门。
      DISABLE_PASSWORD_AUTH: "true"
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/data:/beszel_data
      - ${WONTON_APP_DATA}/socket:/beszel_socket
    healthcheck:
      # 上游的 health 子命令：真问一次 /api/health，不是看进程在不在。
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  # 一次性服务：把 hub 的公钥写进 agent 的授权文件（agent 没有它不会启动），并同步主人的邮箱。
  # key 和 register 共用 provision.sh。curlimages/curl（curl 许可证）只为这里有 sh 和 curl：
  # hub 和 agent 都是 scratch 镜像，脚本没处放。
  key:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["sh", "/provision.sh", "keys"]
    # curl 镜像默认以 uid 10001 运行，要写 agent 的授权文件。
    user: "0:0"
    environment:
      # 管理员的邮箱：主人用户名拼的固定内部地址。老版本里是真实邮箱，升级时就地改过来。
      WONTON_ADMIN_EMAIL: ${WONTON_OWNER_NAME:?插件要主人的用户名}@beszel.internal
      WONTON_SECRET_OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/agent:/var/lib/beszel-agent
    configs:
      - source: provision
        target: /provision.sh
    depends_on:
      hub:
        condition: service_healthy
    restart: "no"

  # 一次性服务：agent 连上以后才有这台服务器的记录，装完打开就看到它（固定的系统 id，host 是套接字路径）。
  # 已登记的系统和它的历史不动，数据被删掉时才重建。
  register:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["sh", "/provision.sh", "register"]
    user: "0:0"
    environment:
      # 管理员的邮箱：主人用户名拼的固定内部地址。老版本里是真实邮箱，升级时就地改过来。
      WONTON_ADMIN_EMAIL: ${WONTON_OWNER_NAME:?插件要主人的用户名}@beszel.internal
      WONTON_SECRET_OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/agent:/var/lib/beszel-agent
    configs:
      - source: provision
        target: /provision.sh
    depends_on:
      hub:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: "no"

  agent:
    # 上游官方镜像（MIT），按 amd64/arm64 清单列表摘要固定。
    image: henrygd/beszel-agent:0.21.1@sha256:cb6868012964d7a68debaa2c84bb72285e5f08531e81f506bd4c493bf052e41c
    # 必须在宿主网络里：不在的话读到的是自己容器的网卡，网络图是错的（上游为此要求 host 网络）。
    # 顺带拿到宿主的温度、磁盘和包更新，不需要 privileged、cap_add 或 pid: host。
    network_mode: host
    # 宿主网络下容器沿用宿主的主机名，详情页的信息条会显示它（公开截图就带出去了）；固定成 server-01，
    # 宿主名只有用户自己看得到的地方再体现。
    hostname: server-01
    environment:
      # 只用套接字，不监听端口；hub 是发起方，agent 不需要 HUB_URL/TOKEN。
      LISTEN: /beszel_socket/beszel.sock
      # hub 的公钥，由 key 步骤写入。
      KEY_FILE: /var/lib/beszel-agent/authorized_key
      DATA_DIR: /var/lib/beszel-agent
      # 空串关掉容器监控：不挂 Docker socket，不给插件 root 权限。
      DOCKER_HOST: ""
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/socket:/beszel_socket
      - ${WONTON_APP_DATA}/agent:/var/lib/beszel-agent
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # 上游的 health 子命令看 agent 自己的健康文件（每 90 秒刷新）。
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    depends_on:
      key:
        condition: service_completed_successfully

configs:
  provision:
    file: provision.sh

x-wonton:
  spec: "0.6"
  id: dev.beszel.beszel
  version: 0.2.0
  kind: app
  title: { zh: 服务器体检（Beszel）, en: Server Health (Beszel) }
  description:
    zh: 像给家里的服务器做体检：CPU、内存、硬盘、网络和温度一页看全，带历史曲线，超过你设的线就提醒你。
    en: "A health check for your home server: CPU, memory, disk, network and temperature on one page with history charts, and an alert when something crosses a line you set."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/status.png, screenshots/cpu.png, screenshots/network.png, screenshots/settings.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://beszel.dev
  license: MIT
  tags:
    zh: [监控]
    en: [Monitoring]
  about:
    zh: |
      看家里服务器的状态：CPU、内存、硬盘、网络、温度和历史图表，超过设定的线会提醒你。

      装好就是这样：打开直接落在这台服务器的详情页，不用添加机器，也不用登录应用本身——网页只经云吞网关进来，网关已经认了你。Agent 在宿主网络里，读到的网卡和传感器是宿主自己的。不看每个容器用了多少：插件自己在不在跑看 App 的“应用”页。告警只在 Beszel 自己的页面里。

      Beszel 是 henrygd 的开源项目（MIT）。
    en: |
      Keep an eye on your home server: CPU, memory, disk, network, temperature and history charts, with alerts when something crosses a line you set.

      It opens like this: the detail page of this server, no machine to add and no app sign-in — the page is only reachable through the Wonton gateway, which already authenticates you. The agent runs in the host network, so the interfaces and sensors it reads are the host's own. Per-container usage is not monitored; whether the plugin itself runs is on the App's Apps page. Alerts stay in Beszel's own pages.

      Beszel is an open-source project by henrygd (MIT).
  release_notes:
    zh: "认人改用主人的固定内部地址（用户名@beszel.internal），不再看邮箱：在云吞里改了邮箱不用重装，直接就能进。升级时管理员的邮箱就地改成内部地址，数据不动。"
    en: "Sign-in now matches a fixed internal address derived from your username (username@beszel.internal) instead of your email — changing your email no longer locks you out. Upgrading rewrites the admin account in place, keeping all data."
  webui:
    service: hub
    port: 8090
    sso: proxy
    proxy:
      headers:
        X-Wonton-User-Email: "{user}@beszel.internal"
  # 面板的“状态”页：这台服务器的详情页。系统 id 由 provision 固定，重启、升级、重装都不变。
  tabs:
    - id: status
      title: { zh: 状态, en: Status }
      icon: tabs/status.svg
      path: /system/wontonlocal0000
  permissions:
    # Agent 要在宿主网络里，网络图才是宿主的网卡。
    - network.host
    # 建管理员和代登录头用主人的用户名拼固定内部地址。
    - owner.identity
  secrets:
    # 管理员在应用里的密码：只在首次启动时用来建账号，被代登录头取代。
    owner_password:
      generate: { bytes: 32 }
  # 上游没写最低内存；空闲实测 21MiB（hub+agent，2026-11-06），早先一次约 55MiB，取 96M。
  requirements:
    arch: [amd64, arm64]
    memory: 96M
